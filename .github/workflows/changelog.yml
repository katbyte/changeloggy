name: changelog

on:
  pull_request:
    types:
      - "synchronize"
      - "labeled"
      - "unlabeled"
    branches:
      - "main"

permissions: {}

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version

      - name: Install changeloggy
        run: go install github.com/sreallymatt/changeloggy@v0.1.0

      - name: Check changelog entry
        if: |
          !contains(github.event.pull_request.labels.*.name, 'no-changelog-needed') &&
          !contains(github.event.pull_request.labels.*.name, 'github-actions')
        id: check
        run: changeloggy check --pr ${{ github.event.pull_request.number }}

      - name: Save PR number
        run: |
          mkdir -p artifacts
          echo "${{ github.event.pull_request.number }}" > artifacts/pr-number

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: changelog-check-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: artifacts/

      - name: Save types table on failure
        if: failure() && steps.check.outcome == 'failure'
        run: |
          changeloggy types > artifacts/types-table

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.check.outcome == 'failure'
        with:
          name: changelog-check-failed-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: artifacts/
