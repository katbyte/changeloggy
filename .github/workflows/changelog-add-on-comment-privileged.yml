name: changelog-add-on-comment-privileged

on:
  workflow_run:
    workflows:
      - "changelog-add-on-comment"
    types:
      - "completed"

permissions: {}

jobs:
  changelog:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download event metadata
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          merge-multiple: true

      - name: Validate PR number
        id: meta
        run: |
          IFS= read -r pr_number < artifacts/pr-number
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid pr-number" >&2
            exit 1
          fi
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
          IFS= read -r replace < artifacts/replace
          echo "replace=$replace" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.meta.outputs.pr-number }}
        run: gh pr checkout "$PR_NUMBER"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version

      - name: Install changeloggy
        run: go install github.com/sreallymatt/changeloggy@v0.1.0

      - name: Parse and add changelog entries
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr-number }}
          REPLACE: ${{ steps.meta.outputs.replace }}
        run: |
          replace_flag=""
          [[ "$REPLACE" == "true" ]] && replace_flag="--replace"
          count=0
          while IFS= read -r line; do
            line="${line%$'\r'}"
            [[ -z "$line" ]] && continue
            if [[ "$line" =~ ^\[([^\]]+)\]\ (.+)$ ]]; then
              type="${BASH_REMATCH[1]}"
              body="${BASH_REMATCH[2]}"
              count=$(( count + 1 ))
              if (( count > 10 )); then
                echo "Maximum of 10 entries exceeded, ignoring remainder" >&2
                break
              fi
              changeloggy add --pr "$PR_NUMBER" --type "$type" $replace_flag "$body"
              replace_flag=""
            fi
          done < <(tail -n +2 artifacts/comment-body)

      - name: Commit and push changelog entries to PR branch
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr-number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .changelog/
          git diff --cached --quiet || git commit -m "changelog: add entries for PR #${PR_NUMBER}"
          git push

      - name: Comment on failure
        if: failure() && steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = parseInt(require('fs').readFileSync('artifacts/pr-number', 'utf8').trim())
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `Failed to add changelog entries. [View run](${runUrl})`,
            })
